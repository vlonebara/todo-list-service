<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Планировщик задач</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
    <main class="login-card">
        <h1>Планировщик задач</h1>
        <p class="muted">Введите пароль, чтобы открыть свои задачи.</p>
        <form id="login-form">
            <p id="login-error" class="message error" role="alert" hidden></p>
            <label>Пароль<input name="password" type="password" autocomplete="current-password" required autofocus></label>
            <button id="signin" class="primary" type="submit">Войти</button>
        </form>
    </main>
    <noscript>Для входа включите JavaScript в браузере.</noscript>
</body>
</html>
