<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Планировщик задач</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <header class="topbar">
        <h1>Планировщик задач</h1>
        <nav aria-label="Действия планировщика">
            <button id="add-task" class="primary" type="button">Добавить задачу</button>
            <button id="show-history" type="button">История</button>
            <button id="undo" type="button">Отменить действие</button>
            <button id="export" type="button">Экспорт</button>
            <button id="signout" class="quiet" type="button" hidden>Выйти</button>
        </nav>
    </header>
    <main>
        <p id="message" class="message" role="status" aria-live="polite" hidden></p>
        <section id="task-view" aria-label="Задачи">
            <form id="search-form" class="toolbar">
                <label class="search-label" for="search">Поиск по задачам или дате</label>
                <div class="search-row">
                    <input id="search" name="search" type="search" maxlength="256" placeholder="Название, комментарий или 08.02.2024">
                    <button id="find" type="submit">Найти</button>
                    <label class="visually-hidden" for="period">Срок задачи</label>
                    <select id="period" name="period">
                        <option value="all">Все задачи</option>
                        <option value="today">Сегодня</option>
                        <option value="overdue">Просроченные</option>
                        <option value="upcoming">Предстоящие</option>
                    </select>
                </div>
            </form>
            <div class="reminder-settings">
                <label><input id="reminders" type="checkbox"> Напоминания в этой вкладке</label>
                <span class="muted">Работают, пока страница открыта.</span>
            </div>
            <p id="reminder-message" class="message" role="status" aria-live="polite" hidden></p>
            <p id="task-count" class="muted" aria-live="polite">Загрузка задач…</p>
            <div id="tasks"></div>
            <button id="more-tasks" class="load-more" type="button" hidden>Показать ещё</button>
        </section>
        <section id="history-view" aria-labelledby="history-title" hidden>
            <h2 id="history-title">История действий</h2>
            <p class="muted">Сохраняются создания, изменения, выполнения и удаления. Можно отменять последние действия по очереди.</p>
            <div id="history"></div>
            <button id="more-history" class="load-more" type="button" hidden>Ещё история</button>
        </section>
    </main>
    <dialog id="task-dialog" aria-labelledby="form-title">
        <form id="task-form">
            <h2 id="form-title">Новая задача</h2>
            <p id="form-error" class="message error" role="alert" hidden></p>
            <fieldset id="task-fields" class="form-fields">
                <div class="form-row">
                    <label>Дата<input name="date" type="date" min="0001-01-01" max="9999-12-31" required></label>
                    <label class="grow">Задача<input name="title" type="text" maxlength="200" required></label>
                </div>
                <label>Комментарий<textarea name="comment" maxlength="5000" rows="3"></textarea></label>
                <label>Правило повторения
                    <select name="mode">
                        <option value="">Не повторять</option>
                        <option value="d">Повторять с интервалом</option>
                        <option value="w">Еженедельно</option>
                        <option value="m">Ежемесячно</option>
                        <option value="y">Ежегодно</option>
                    </select>
                </label>
                <fieldset data-repeat="d" hidden disabled>
                    <legend>Интервал</legend>
                    <label>Каждые X дней<input name="interval" type="number" min="1" max="400" value="1" required></label>
                </fieldset>
                <fieldset data-repeat="w" hidden disabled>
                    <legend>Дни недели</legend>
                    <div id="weekdays" class="choices"></div>
                </fieldset>
                <fieldset data-repeat="m" hidden disabled>
                    <legend>Дни и месяцы</legend>
                    <label>Дни месяца через запятую<input name="monthdays" type="text" placeholder="1,15,25" maxlength="100"></label>
                    <div class="choices month-ends">
                        <label><input name="penultimate" type="checkbox"> Предпоследний день месяца</label>
                        <label><input name="last" type="checkbox"> Последний день месяца</label>
                    </div>
                    <p class="field-label">Месяцы</p>
                    <div id="months" class="choices months"></div>
                </fieldset>
            </fieldset>
            <footer class="form-actions">
                <button id="close-task" type="button">Закрыть</button>
                <button id="save-task" class="primary" type="submit">Сохранить</button>
            </footer>
        </form>
    </dialog>
    <noscript>Для работы планировщика включите JavaScript в браузере.</noscript>
</body>
</html>
